    <script>
        // // Spread Operator : 분해 기능
        var arr1 = [4, 5, 6];
        var arr2 = [1, 2, 3];
        var arr3 = arr1.concat(arr2);
        var arr3 = arr2.concat(arr1);
        console.log(arr3);

        var arr4 = [4, 5, 6];
        var arr5 = ["일", 1, 2, ...arr4, 3, false, arr4];
        // ...을 붙일 경우 분해되어 합쳐짐
        // 중간 삽입도 가능
        console.log(arr5);
