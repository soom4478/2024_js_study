<body>
    <script>
        function solution(arr) {
            let answer=[] = arr;

            // 방법1 : 기존의 for문을 이용한 방식
            // let sum = 0;
            // for(var i=0; i<arr.length; i++) {
            //     console.log(arr);
            //     sum += arr[i];
            // }
            
            // 방법2
            // let sum = 0;
            // for(let x of arr) {
            //     console.log(x);
            //     sum += x;
            // }

            // 방법3 : reduce() 사용
            // let sum = arr.reduce( function(a, b) {
            //     return a + b;
            // });

            // 방법4 : arrow Function
            let sum = arr.reduce((a, b) => a + b);
            console.log(sum);

            for(let i=0; i<arr.length; i++) {
                for(let j=i+1; j<arr.length; j++) {
                    // console.log(arr[i],arr[j]);
                    if(sum - (arr[i] + arr[j]) === 100) {
                        // console.log(i,j);
                        answer.splice(j,1);
                        answer.splice(i,1); // 먼저 삭제 시 다른 값이 삭제되게 됨 -> 순서 변경
                    }
                } // for j
            } // for i

            return answer;
        }
        
        var arr = [20, 7, 23, 19, 10, 15, 25, 8, 13];
        console.log(solution(arr));
    </script>
