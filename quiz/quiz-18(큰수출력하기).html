<html>
<head>
    <title>큰 수 출력하기(바로 앞 수보다 크면 출력)</title>
</head>
<body>
    <script>
        function solution(arr) {
            let answer = [arr[0]];
            for (i in arr) {
                if(arr[i] > arr[i-1]) answer.push(arr[i]);
            }

            return answer;
        }
        let arr = [7, 3, 9, 5, 6, 12];
        console.log(solution(arr));
    </script>
</body>
</html>
