<body>
    <script>
        function solution(str, t) {
            let answer = [];

            // 느린 내 버전 O(n2)
            // for(let i in str) {
            //     var left, right;
            //     for(let j=i; j<str.length; j++) {
            //         if(str[j] === t) {
            //             left = j-i;
            //             break;
            //         }
            //     }
            //     for(let j=i; j>=0; j--) {
            //         if(str[j] === t) {
            //             right = i-j;
            //             break;
            //         }
            //     }
            //     if(left>right) answer.push(right);
            //     else answer.push(left);
            // }

            // 빠른 쌤 버전 O(n)
            // 왼쪽부터 거리의 크기를 배열에 넣음
            var p = 1000;
            for(let x of str) {
                if(x === t) {
                    p = 0;
                }
                else {
                    p++;
                }
                answer.push(p);
            }

            // 오른쪽부터 거리를 구한 뒤, 왼쪽 값과 비교하여 작은값을 배열에 넣음
            p = 1000;

            for(let i=str.length-1; i>=0; i--) {
                if(str[i] != t) {
                    p++;
                    answer[i] = Math.min(answer[i], p);
                }
                else {
                    p = 0;
                }
            }

            return answer;
        }
        
        let str = "teachermode"
        console.log(solution(str, 'e'));
    </script>
