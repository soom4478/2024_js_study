<html>
<head>
    <title>회문문자열</title>
</head>
<body>
    <script>
        function solution(str) {
            let answer = "Yes";
            str = str.toLowerCase();
            let len = str.length;

            // 방법 1 : 직접 비교 방식
            // for(let i=0; i<Math.floor(len/2); i++) {
            //     if(str[i] !== str[len-i-1]) return "No";
            // }

            // 방법 2 : reverse() 함수 사용
            // console.log(str.split("").reverse().join(""));
            if(str !== str.split("").reverse().join(""))
                return answer = "No";

            return answer;
        }
        
        let str = "gooG"
        console.log(solution(str));
    </script>
</body>
</html>
