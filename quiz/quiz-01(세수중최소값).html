<html>
<head>
    <title>세수중최소값</title>
</head>
<body>
    <script>
        function solution(a, b, c) {
            let answer;

            // insert code

            if(a < b) {
                answer = a;
            }
            else {
                answer = b;
            }

            if(answer > c) {
                answer = c;
            }

            return answer;
        }
        

        console.log(solution(6, 5, 11));
    </script>
</body>
</html>
