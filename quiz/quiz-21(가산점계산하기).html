<html>
<head>
    <title>가산점 계산하기</title>
</head>
<body>
    <script>
        function solution(arr) {
            let answer = 0, count = 0;
            for(i of arr) {
                if(i === 1) {
                    answer += 1+count;
                    count += 1;
                }
                else count = 0;
            }
            return answer;
        }
        
    let arr = [1, 0, 1, 1, 1, 0, 0, 1, 1, 0];
        console.log(solution(arr));
    </script>
</body>
</html>
