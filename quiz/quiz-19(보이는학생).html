<html>
<head>
    <title>보이는 학생(앞 학생들보다 크면 보이고 작으면 안보임)</title>
</head>
<body>
    <script>
        function solution(arr) {
            let answer = 1, max = arr[0];
            for (i in arr) {
                if(max < arr[i]) {
                    max = arr[i];
                    answer++;
                }
            }

            return answer;
        }
        let arr = [130, 135, 148, 140, 145, 150, 150, 153];
        console.log(solution(arr));
    </script>
</body>
</html>
