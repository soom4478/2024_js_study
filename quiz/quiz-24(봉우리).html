<html></html>
<head>
    <title>봉우리</title>
</head>
<body>
    <script>
        // 봉우리 개수 출력(상하좌우보다 더 크면 봉우리)
        function solution(arr) {
            let answer = 0;
            let n = arr.length; // n = 4
            // 상하좌우값
            let dx = [-1, 0, 1, 0]; // 행
            let dy = [0, 1, 0, -1]; // 열

            for(let i=0; i<n; i++) {
                for(let j=0; j<n; j++) {

                    let flag = 1;

                    for(let k=0; k<4; k++) {
                        // console.log(dx[k], dy[k]);

                        let nx = i + dx[k];
                        let ny = j + dy[k];

                        if(nx>=0 && nx<5 && ny>=0 && ny<5 && arr[nx][ny] >= arr[i][j]) {
                            flag = 0;
                            break;
                        }

                    } // for k

                    if(flag) answer++;

                }
            }

            return answer;
        }
        var arr = [
            [5, 3, 7, 2, 3],
            [3, 7, 1, 6, 1],
            [7, 2, 5, 3, 4],
            [4, 3, 6, 4, 1],
            [8, 7, 3, 5, 2],
        ]
        console.log(solution(arr));
    </script>
</body>
</html>
