    <script>
        function solution(arr) {
            let answer = Number.MIN_SAFE_INTEGER;
            let n = arr.length;
            let sum1, sum2;

            for(let i=0; i<n; i++) {
                sum1 = sum2 = 0; // 초기화
                for(let j=0; j<n; j++) {
                    sum1 += arr[i][j]; // 행의 합(가로)
                    sum2 += arr[j][i]; // 열의 합(세로로)
                }
                // console.log(sum1);
                // console.log(sum2);
                answer = Math.max(answer, sum1, sum2); // 최대값만 answer에 저장
            }

            sum1 = sum2 = 0; // 초기화
            for(let i=0; i<n; i++) { // 대각선 합
                sum1 += arr[i][i];
                sum2 += arr[i][n-i-1];
            }
            answer = Math.max(answer, sum1, sum2); // 또 최대값만 answer에 저장

            // 내 풀이
            // let answer = Number.MIN_SAFE_INTEGER;
            // var sum = [0, 0, 0, 0];
            // var hap1 = 0, hap2 = 0;

            // for(let i in arr) {
            //     hap1 = 0;
            //     hap2 = 0;
            //     for(let j in arr) {
            //         hap1 += arr[i][j];
            //         hap2 += arr[j][i];
            //         if(i === j) sum[2] += arr[i][j];
            //         if(i+j === 4) sum[3] += arr[i][j];
            //     }
            //     if(sum[0] < hap1) sum[0] = hap1;
            //     if(sum[1] < hap2) sum[1] = hap2;
            //     answer = Math.max(sum);
            // }

            // for(let i of sum) {
            //     if(answer < i) answer = i;
            // }

            return answer;
        }
        
        var arr = [
            [10,13,10,12,15],
            [12,39,30,23,11],
            [11,25,50,53,15],
            [19,27,29,37,27],
            [19,13,30,13,19]
        ];
        console.log(solution(arr));
    </script>
