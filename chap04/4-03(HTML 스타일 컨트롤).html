<html>
<head>
    <title>HTML 스타일 컨트롤</title>

    <style>
        .border-red {
            border: 3px dashed red;
        }

        .border-green{
            border: 3px solid green;
        }

        .border-default{
            border: 3px solid blue;
        }
    </style>
</head>
<body>
    Text :
    <br>
    <input type="text" id="text1" onblur="changeColor()"> <!-- 엘리먼트 - getElementbyId or this -->
    <br>
    Radio(이메일 수신) :
    <input type="radio" name="radio_yn" onclick="showEamil()">동의
    <input type="radio" name="radio_yn" checked onclick="hideEamil()">비동의
    <div id="divEmail" style="display: none">
        이메일 <input type="text" id="email">
    </div>
    <br>
    <br>
    <select onchange="doChange(this)">
        <option value="KO">한국</option>
        <option value="CH">중국</option>
        <option value="JP">일본</option>
    </select>

    <select id="select2" style="display: none;">
        <option>서울</option>
        <option>대전</option>
        <option>대구</option>
        <option>천안</option>
    </select>

    <br>
    <br>
    <input type="button" value="회원가입" onclick="doSave()">

    <script>
        function changeColor() {
            // console.log("changeColor() 호출");
            var txt1 = document.getElementById("text1");
            // console.log(txt.value);
            if(txt1.value === "red") {
                text1.className = "border-red";
            }
            else if(txt1.value === "green") {
                text1.className = "border-green";
            }
            else {
                text1.className = "border-default";
            }
        }
        function showEamil() {
            document.getElementById("divEmail").style.display="";
        }
        function hideEamil() {
            document.getElementById("divEmail").style.display="none";
        }
        function doChange(obj) {
            // console.log(obj.value);
            if(obj.value === "KO")
                document.getElementById("select2").style.display = "";
            else
            document.getElementById("select2").style.display = "none";
        }
        function doSave() {
            var txt1 = document.getElementById("text1");
            // console.log(txt1.value);
            if(txt1.value === "") {
                txt1.className = "border-red";
                return alert("필수값을 입력해주세요");
            }
        }
    </script>
</body>
</html>
